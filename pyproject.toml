[project]
name = "coding_agent"
version = "0.1.0"
description = "coding_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<2.0.0",
]

[project.scripts]
coding_agent = "coding_agent.main:run"
run_crew = "coding_agent.main:run"
train = "coding_agent.main:train"
replay = "coding_agent.main:replay"
test = "coding_agent.main:test"
run_with_trigger = "coding_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "50d80bc5-a4d4-403f-ac79-2c41b649f47e"
